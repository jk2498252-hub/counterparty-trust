name: Desktop app (Windows)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Counterparty-Trust-Setup
          path: desktop/dist/*.exe
      # On a version tag (e.g. v0.1.0), publish a release with the installer as a download.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          body: |
            Windows installer for the Counterparty Trust workbench.
            Download **Counterparty-Trust-Setup-*.exe**, run it, then open Counterparty Trust from the Start menu.
            Windows may show "Windows protected your PC" because the installer is not signed yet: click More info → Run anyway.
