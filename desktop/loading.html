<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
<title>Counterparty Trust</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #f6f8f7; color: #16201c;
         font-family: "Segoe UI", system-ui, sans-serif; }
  .box { text-align: center; }
  img { width: 88px; height: 88px; }
  h1 { font-size: 20px; margin: 16px 0 4px; }
  p { color: #5b6b64; font-size: 14px; margin: 0; }
  .bar { width: 180px; height: 4px; margin: 20px auto 0; background: #dfe6e2; border-radius: 2px; overflow: hidden; }
  .bar span { display: block; width: 40%; height: 100%; background: #0f5c4a; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
</style>
</head>
<body>
  <div class="box">
    <img src="assets/icon.png" alt="">
    <h1>Counterparty Trust</h1>
    <p>Starting the workbench…</p>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
