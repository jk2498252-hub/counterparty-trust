<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>Encrypt backup</title>
<style>body{font:15px system-ui,sans-serif;padding:20px;color:#17372f;background:#f6f8f7}label{display:block;margin:16px 0 6px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #a7bbb1;border-radius:5px}button{margin-top:20px;padding:10px 16px;background:#235e4b;color:white;border:0;border-radius:5px}p{line-height:1.5}#error{color:#9b2929}</style></head>
<body><h2>Protect this backup</h2><p>Choose a password of at least 12 characters. You need this password to restore the backup. Keep it in a password manager.</p>
<form id="form"><label for="password">Backup password</label><input id="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required autofocus>
<label for="confirm">Repeat password</label><input id="confirm" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
<p id="error" role="alert"></p><button type="submit">Encrypt and save</button></form><script src="backup-password.js"></script></body></html>
